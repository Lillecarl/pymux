# Every intentional difference from tmux, with the test that pins it
# and the probe that proved what tmux does. The rule the ledger
# enforces on itself: a behavior that differs from tmux and holds no
# entry here is a bug. Lillecarl/pyterm#387.
unlisted_divergences_are_bugs = true

[[divergence]]
name = "swap-pane -U and -D directions are inverted"
command = "swap-pane"
tmux = "-U swaps the active pane with the pane above, -D with the pane below"
pymux = "-U swaps with the pane below, -D with the pane above"
test = "test_swap_pane_swaps_the_other_way_from_tmux_product_divergence"
evidence = "tests/fixtures/tmux37/accepted_product_divergences.txt"
reason = """
pymux's own help has said 'Swap with the pane below' for -U since
before the ledger existed, and the pane-management mode built on it
(#397) reads the same way. Both directions of the flip are recorded
under one entry: a person with tmux's muscle memory sends their pane
the other way either way. Flipping the flags to match tmux is one
line and a break in the other direction; the ledger holds the choice
until the differential harness (#386) makes matching tmux the cheap
default. Lillecarl/pyterm#402.
"""
references = ["Lillecarl/pyterm#402", "Lillecarl/pyterm#387"]

[[divergence]]
name = "the prefix pressed twice sends the prefix, whatever key it is"
command = "send-prefix"
tmux = "send-prefix is bound to C-b in the prefix table, and stays there when the prefix option changes"
pymux = "the prefix key pressed twice sends the prefix to the pane, following the prefix option; a bind-key on that key wins"
test = "test_a_moved_prefix_twice_reaches_the_pane_product_divergence"
evidence = "tests/fixtures/tmux37/accepted_product_divergences.txt"
reason = """
In tmux a person who moves the prefix to C-a cannot send C-a to the
pane until they also bind C-a send-prefix, and C-b stays bound to a
command that sends C-a. Pressing the prefix twice is how a person
sends it, so that rule follows the prefix. Carl, 2026-10-22: "the
way prefix passes into panes by default is pressing it twice, that
should be a feature".
"""
references = ["Lillecarl/pyterm#387"]

[[divergence]]
name = "an unclosed quote is an error on the line it opens"
command = "source-file"
tmux = "a quote nobody closes takes the rest of the file into one word, newlines and all"
pymux = "the file does not parse, and the error names the line the quote opened on"
test = "test_an_unclosed_quote_is_an_error_product_divergence"
evidence = "pymux/grammar.py _Lexer.token; tmux 3.6 cmd-parse.y yylex_token ends a word at EOF in any state"
reason = """
A file whose last forty lines are one argument runs as something
nobody wrote, and tmux names no line. Refusing the file and naming
where the quote opened is the answer a person can act on.
Lillecarl/pyterm#1029.
"""
references = ["Lillecarl/pyterm#1029"]

[[divergence]]
name = "%hidden NAME=value lives for the text that sets it"
command = "source-file"
tmux = "the variable goes into the global environment, hidden from panes and show-environment"
pymux = "the variable expands $NAME in the rest of that text only"
test = "test_hidden_lives_for_one_text_product_divergence"
evidence = "tmux 3.6 cmd-parse.y hidden_assignment, environ_put with ENVIRON_HIDDEN"
reason = """
pymux's global environment has no hidden flag, and storing the value
there would hand a secret to every new pane. Lillecarl/pyterm#1043.
"""
references = ["Lillecarl/pyterm#1043", "Lillecarl/pyterm#1029"]
