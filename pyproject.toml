[tool.ruff.lint.isort]
# Mirror of the pyterm root's `ruff.toml` above: the build sandbox sees
# only this tree, so discovery from a file under it must end here.
# libpymux, prompt_toolkit_rs and pymux_rs are distributions of their own,
# installed like any other dependency: third-party by installation,
# wherever they are developed. pymux is the project under check:
# first-party, always. Without the pins the grouping follows
# PYTHONPATH -- with the dev shell's set `ruff check` merges
# `libpymux` with `pymux`, without it (and in the sandbox, which sets
# none) it splits them.
known-first-party = ["pymux"]
known-third-party = ["libpymux", "prompt_toolkit_rs", "pymux_rs"]
