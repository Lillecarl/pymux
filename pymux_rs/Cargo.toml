[package]
name = "pymux_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3.34"

[profile.release]
lto = true
codegen-units = 1
