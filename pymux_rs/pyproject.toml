[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pymux_rs"
version = "0.1.0"
description = "Rust kernels for pymux's image loops, installed over its Python ones"
requires-python = ">=3.14"
license = "BSD-3-Clause"
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "pymux_rs._native"
features = ["pyo3/extension-module"]
