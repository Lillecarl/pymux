# pymux's AI plugins.
#
# **A project of its own, inside the repository of the server that runs
# it**, as pymux-mcp is. pymux finds it through the `pymux.plugins`
# entry-point group, and only a pymux built with
# `pymux.withPlugins (ps: [ ps.pymux-ai ])` has it: a plain pymux never
# talks to a model. Lillecarl/pyterm#983.
[project]
name = "pymux-ai"
version = "0.1"
description = "pymux plugins that ask a model about what a pane shows."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pymux",
    "libpymux",
    "anyio>=4.7.0",
    # The pane as a picture, drawn with the fonts pymux-mcp bundles.
    "pymux-mcp",
    "pydantic>=2.0.0",
    # aid's model transports and messages, without aid. Lillecarl/aid#75.
    "aid-agent",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Lillecarl/pymux"

[project.entry-points."pymux.plugins"]
claude_code_encourager = "pymux_ai.claude_code_encourager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pymux_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# anyio's pytest plugin runs a coroutine test with no mark on it.
anyio_mode = "auto"
